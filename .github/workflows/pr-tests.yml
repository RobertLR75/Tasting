name: PR Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Tasting.sln

      - name: Build
        run: dotnet build Tasting.sln --no-restore --configuration Release

      - name: Run unit tests
        run: |
          dotnet test Tasting.sln \
            --no-build \
            --configuration Release \
            --filter "FullyQualifiedName!~IntegrationTests" \
            --logger "trx;LogFileName=unit-results.trx" \
            --results-directory ./test-results

      - name: Run integration tests
        run: |
          dotnet test tests/Tasting.Api.IntegrationTests/Tasting.Api.IntegrationTests.csproj \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=integration-results.trx" \
            --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results/**/*.trx

  participant-e2e:
    name: Participant E2E
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/Frontend/Tasting.App

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Frontend/Tasting.App/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build participant app
        run: npm run build

      - name: Run participant E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: participant-playwright-report
          path: src/Frontend/Tasting.App/playwright-report
          if-no-files-found: ignore
